model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  # Root API master key 🔑 for management and the LiteLLM Admin UI (must start with sk-)
  master_key: os.environ/LITELLM_MASTER_KEY

  # Salt key 🔒 for additional security (must start with sk-)
  salt_key: os.environ/LITELLM_SALT_KEY

  # Set to true when enabling JWT/OIDC authentication via Keycloak
  enable_jwt_auth: false

router_settings:
  enable_pre_call_checks: true # required to enforce max_input_tokens
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
