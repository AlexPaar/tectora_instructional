[project]
name = "tectora_instructional"
version = "0.1.0a0"
description = "The Agentic Fabric for Research Data"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "docling",
    "fastmcp",
    "langchain-mcp-adapters",
    "langchain-openai",
    "langgraph",
    "prompt-toolkit",
    "pydantic",
    "python-dotenv",
    "requests",
    "rich",
    "typer",
    "objprint",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent"]
